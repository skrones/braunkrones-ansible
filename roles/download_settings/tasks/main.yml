- name: Require download settings inputs
  ansible.builtin.assert:
    that:
      - download_settings_user is defined
      - download_settings_user | length > 0
    fail_msg: >-
      Set download_settings_user or desktop_user before running download_settings.

- name: Look up download settings user
  ansible.builtin.getent:
    database: passwd
    key: "{{ download_settings_user }}"

- name: Set download settings user environment
  ansible.builtin.set_fact:
    download_settings_user_uid: "{{ ansible_facts.getent_passwd[download_settings_user][1] }}"
    download_settings_user_environment:
      HOME: "{{ ansible_facts.getent_passwd[download_settings_user][4] }}"

- name: Read chezmoi source path
  ansible.builtin.command:
    cmd: chezmoi source-path
  become: true
  become_user: "{{ download_settings_user }}"
  environment: "{{ download_settings_user_environment }}"
  register: download_settings_source_path
  changed_when: false

- name: Pull chezmoi source changes
  ansible.builtin.command:
    cmd: git pull
    chdir: "{{ download_settings_source_path.stdout }}"
  become: true
  become_user: "{{ download_settings_user }}"
  environment: "{{ download_settings_user_environment }}"
  changed_when: true

- name: Reconcile GNOME extensions
  ansible.builtin.shell: |
    set -euo pipefail

    extension_file="{{ download_settings_source_path.stdout }}/{{ download_settings_gnome_extensions_file }}"
    desired_extensions="$(mktemp)"
    installed_extensions="$(mktemp)"
    extension_download_dir="$(mktemp -d)"
    shell_version="$(gnome-shell --version | awk '{ print $3 }')"
    trap 'rm -f "$desired_extensions" "$installed_extensions"; rm -rf "$extension_download_dir"' EXIT

    install_extension() {
      extension_bundle="$extension_download_dir/$1.zip"

      python3 - "$1" "$shell_version" "$extension_bundle" <<'PY'
    import json
    import sys
    import urllib.parse
    import urllib.request

    uuid, shell_version, extension_bundle = sys.argv[1:]
    base_url = "https://extensions.gnome.org"
    query = urllib.parse.urlencode({"uuid": uuid, "shell_version": shell_version})

    with urllib.request.urlopen(f"{base_url}/extension-info/?{query}") as response:
      extension_info = json.load(response)

    download_url = extension_info.get("download_url")
    if not download_url:
      raise SystemExit(f"No download URL found for {uuid} on GNOME Shell {shell_version}")

    with urllib.request.urlopen(urllib.parse.urljoin(base_url, download_url)) as response:
      with open(extension_bundle, "wb") as bundle:
        bundle.write(response.read())
    PY

      gnome-extensions install --force "$extension_bundle"
    }

    sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$extension_file" | sort -u > "$desired_extensions"
    gnome-extensions list | sort -u > "$installed_extensions"

    comm -23 "$installed_extensions" "$desired_extensions" |
      while read -r extension; do
        uninstall_output="$(gnome-extensions uninstall "$extension" 2>&1)" || {
          if [[ "$uninstall_output" != *"Cannot uninstall system extensions"* ]]; then
            printf '%s\n' "$uninstall_output" >&2
            exit 1
          fi
        }
      done

    comm -13 "$installed_extensions" "$desired_extensions" |
      while read -r extension; do
        printf 'Installing GNOME extension %s\n' "$extension"
        install_extension "$extension"
      done

    enabled_extensions="$({
      python3 - "$desired_extensions" <<'PY'
    import sys

    with open(sys.argv[1], encoding="utf-8") as extension_file:
        extensions = [line.strip() for line in extension_file if line.strip()]

    print("[" + ", ".join(repr(extension) for extension in extensions) + "]")
    PY
    })"
    dbus-run-session -- gsettings set org.gnome.shell enabled-extensions "$enabled_extensions"
  args:
    executable: /usr/bin/bash
  become: true
  become_user: "{{ download_settings_user }}"
  environment: "{{ download_settings_user_environment }}"
  changed_when: true

- name: Refresh GNOME extensions in active session
  ansible.builtin.shell: |
    set -euo pipefail

    extension_file="{{ download_settings_source_path.stdout }}/{{ download_settings_gnome_extensions_file }}"
    user_runtime_dir="/run/user/{{ download_settings_user_uid }}"
    session_bus="$user_runtime_dir/bus"

    if [[ ! -S "$session_bus" ]]; then
      printf 'No active GNOME session bus found at %s; extension changes will take effect at next login.\n' "$session_bus" >&2
      exit 0
    fi

    export XDG_RUNTIME_DIR="$user_runtime_dir"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=$session_bus"

    enabled_extensions="$({
      sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$extension_file" | sort -u |
        python3 - <<'PY'
    import sys

    extensions = [line.strip() for line in sys.stdin if line.strip()]
    print("[" + ", ".join(repr(extension) for extension in extensions) + "]")
    PY
    })"

    gsettings set org.gnome.shell enabled-extensions "$enabled_extensions"

    sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$extension_file" | sort -u |
      while read -r extension; do
        gnome-extensions enable "$extension"
      done
  args:
    executable: /usr/bin/bash
  become: true
  become_user: "{{ download_settings_user }}"
  environment: "{{ download_settings_user_environment }}"
  changed_when: true

- name: Apply chezmoi settings
  ansible.builtin.command:
    cmd: chezmoi apply --force
  become: true
  become_user: "{{ download_settings_user }}"
  environment: "{{ download_settings_user_environment }}"
  changed_when: true